name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Java (for PySpark)
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Set environment variables
        run: |
          echo "ROOT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "BRONZE_PATH=$GITHUB_WORKSPACE/data/bronze" >> $GITHUB_ENV
          echo "SILVER_PATH=$GITHUB_WORKSPACE/data/silver" >> $GITHUB_ENV
          echo "GOLD_PATH=$GITHUB_WORKSPACE/data/gold" >> $GITHUB_ENV

      - name: Run tests
        run: pytest -v
